[workspace]
resolver = "3"
members = [
    "crates/bridge-artifact",
    "crates/bridge-automation",
    "crates/agent-bridge-cli",
    "crates/bridge-command-policy",
    "crates/bridge-config",
    "crates/bridge-domain",
    "crates/bridge-git",
    "crates/bridge-opencode",
    "crates/bridge-path-policy",
    "crates/bridge-storage",
    "crates/bridge-verifier",
    "crates/bridge-worker",
    "crates/bridge-submission",
    "crates/bridge-runtime",
    "crates/bridge-mcp",
    "crates/bridge-delivery",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
bridge-automation = { path = "crates/bridge-automation" }
bridge-artifact = { path = "crates/bridge-artifact" }
bridge-command-policy = { path = "crates/bridge-command-policy" }
bridge-config = { path = "crates/bridge-config" }
bridge-domain = { path = "crates/bridge-domain" }
bridge-git = { path = "crates/bridge-git" }
bridge-opencode = { path = "crates/bridge-opencode" }
bridge-path-policy = { path = "crates/bridge-path-policy" }
bridge-storage = { path = "crates/bridge-storage" }
bridge-worker = { path = "crates/bridge-worker" }
bridge-runtime = { path = "crates/bridge-runtime" }
bridge-mcp = { path = "crates/bridge-mcp" }
bridge-delivery = { path = "crates/bridge-delivery" }
command-group = "5"
nix = { version = "0.27", default-features = false, features = ["fs"] }
process-wrap = { version = "10", default-features = false, features = ["std", "process-session"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
uuid = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
