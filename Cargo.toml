[workspace]
resolver = "3"
members = [
    "crates/agent-bridge-cli",
    "crates/bridge-domain",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
bridge-domain = { path = "crates/bridge-domain" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
