[workspace]
resolver = "3"
members = [
    "crates/agent-bridge-cli",
    "crates/bridge-command-policy",
    "crates/bridge-config",
    "crates/bridge-domain",
    "crates/bridge-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
bridge-command-policy = { path = "crates/bridge-command-policy" }
bridge-config = { path = "crates/bridge-config" }
bridge-domain = { path = "crates/bridge-domain" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
uuid = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
